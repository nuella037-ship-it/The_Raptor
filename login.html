<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – The Raptor Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a5276 0%, #1e8449 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-container {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #1a5276;
        }
        .login-logo h1 span {
            color: #1e8449;
        }
        .login-logo p {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        .form-control {
            border-radius: 12px;
            padding: 0.75rem 1rem;
            border: 2px solid #e9ecef;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            border-color: #1a5276;
            box-shadow: none;
        }
        .btn-login {
            background: #1a5276;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0.75rem;
            font-weight: 600;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-login:hover {
            background: #2e86c1;
            color: #fff;
        }
        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .alert {
            border-radius: 12px;
        }
        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #6c757d;
        }
        .footer-text a {
            color: #1a5276;
            text-decoration: none;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
        .password-toggle {
            position: relative;
        }
        .password-toggle .toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6c757d;
            cursor: pointer;
            padding: 0.25rem;
        }
        .password-toggle .toggle-btn:hover {
            color: #1a5276;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-logo">
            <h1>The<span>Raptor</span></h1>
            <p>Admin Login</p>
        </div>

        <div id="loginMessage" class="alert d-none" role="alert"></div>

        <form id="loginForm" novalidate>
            <div class="mb-3">
                <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="admin@theraptor.com" required />
            </div>
            <div class="mb-3 password-toggle">
                <label for="loginPassword" class="form-label fw-semibold">Password</label>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required />
                <button type="button" class="toggle-btn" id="togglePassword" aria-label="Toggle password visibility">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginBtnText"><i class="fas fa-lock"></i> Sign In</span>
                <span id="loginBtnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <div class="footer-text">
            <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </div>
    </div>

    <script>
        // ============================================================
        //  SUPABASE CONFIG (session stored in sessionStorage)
        // ============================================================
        const SUPABASE_URL = "https://aslkopamkdnvofjqzgjz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_yZ8KyiOxJT3GBR_6wX1Plw_Yt_5IQ6f";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                storage: window.sessionStorage   // session cleared on tab close
            }
        });

        // ============================================================
        //  DOM REFS
        // ============================================================
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const btnText = document.getElementById('loginBtnText');
        const btnSpinner = document.getElementById('loginBtnSpinner');
        const messageEl = document.getElementById('loginMessage');
        const toggleBtn = document.getElementById('togglePassword');

        // ============================================================
        //  TOGGLE PASSWORD VISIBILITY
        // ============================================================
        toggleBtn.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        // ============================================================
        //  SHOW MESSAGE HELPER
        // ============================================================
        function showMessage(message, type = 'danger') {
            messageEl.textContent = message;
            messageEl.className = `alert alert-${type} d-block`;
        }

        function hideMessage() {
            messageEl.className = 'alert d-none';
        }

        // ============================================================
        //  CHECK IF ALREADY LOGGED IN
        // ============================================================
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                window.location.href = 'admin.html';
            }
        }
        checkSession();

        // ============================================================
        //  LOGIN FORM SUBMIT
        // ============================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideMessage();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                showMessage('Please enter both email and password.', 'warning');
                return;
            }

            btnText.classList.add('d-none');
            btnSpinner.classList.remove('d-none');
            loginBtn.disabled = true;

            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    if (error.message === 'Invalid login credentials') {
                        showMessage('Invalid email or password. Please try again.', 'danger');
                    } else if (error.message.includes('Email not confirmed')) {
                        showMessage('Please confirm your email before logging in.', 'warning');
                    } else {
                        showMessage('Login failed: ' + error.message, 'danger');
                    }
                    return;
                }

                if (data.session) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 800);
                }

            } catch (err) {
                showMessage('Something went wrong. Please try again.', 'danger');
                console.error('Login error:', err);
            } finally {
                btnText.classList.remove('d-none');
                btnSpinner.classList.add('d-none');
                loginBtn.disabled = false;
            }
        });

        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
        emailInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                passwordInput.focus();
            }
        });
    </script>

</body>
</html>
